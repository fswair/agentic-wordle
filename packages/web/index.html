<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agentic Wordle</title>
    <meta name="description" content="A daily word game for agentic AI, ML, software and IT terms. One word per category, every day." />
    <meta name="theme-color" content="#121213" />
    <meta property="og:title" content="Agentic Wordle" />
    <meta property="og:description" content="A daily word game for agentic AI, ML, software and IT terms." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header>
        <button id="btn-title" class="title" type="button" aria-label="Home">
          <h1>Agentic Wordle</h1>
          <span id="subtitle"></span>
        </button>
        <nav>
          <button id="btn-help" class="icon" type="button" aria-label="How to play">?</button>
          <button id="btn-stats" class="icon" type="button" aria-label="Statistics">&#9776;</button>
          <button id="btn-settings" class="icon" type="button" aria-label="Settings">&#9881;</button>
          <button id="btn-account" class="pill" type="button">Sign in</button>
        </nav>
      </header>

      <section id="home" hidden></section>

      <section id="game" hidden>
        <div id="progress-line"></div>
        <main>
          <div id="toasts" aria-live="polite"></div>
          <div id="board" role="grid" aria-label="Game board"></div>
        </main>
        <div id="hint-row" hidden>
          <button id="btn-hint" class="pill" type="button">Show hint</button>
          <span id="hint-text"></span>
        </div>
        <div id="keyboard"></div>
      </section>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
